name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into Android assets
        run: mkdir -p app/src/main/assets && cp index.html app/src/main/assets/index.html

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk national-energy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: national-energy-execution-apk
          path: national-energy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest national-energy.apk \
            --title "تطبيق تنفيذ الطاقة الوطنية – الإصدار 1.${{ github.run_number }}" \
            --notes "آخر نسخة من تطبيق تنفيذ الطاقة الوطنية. حمّل ملف national-energy.apk وثبّته على الهاتف." \
            --latest
